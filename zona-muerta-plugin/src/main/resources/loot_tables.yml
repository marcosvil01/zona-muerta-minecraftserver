# ===================================================================
# Curas - Configuracion del sistema de curas
# ===================================================================
cures:
  bandage:
    cure_amount: 10
    ingredients:
      - PAPER
      - STRING
  cure_potion:
    cure_amount: 25
    ingredients:
      - POTION
      - GOLDEN_APPLE
      - FERMENTED_SPIDER_EYE
  antidote:
    cure_amount: 50
    ingredients:
      - GOLDEN_APPLE
      - BLAZE_POWDER
      - GHAST_TEAR
  antidote_complete:
    cure_amount: 100
    ingredients:
      - ENCHANTED_GOLDEN_APPLE
      - NETHER_STAR
      - SHULKER_SHELL

# ===================================================================
# Weapons - Configuracion de armas artesanales
# ===================================================================
weapons:
  machete_oxidado:
    material: IRON_SWORD
    enchantments:
      DAMAGE_ALL: 2
    name: "Machete Oxidado"
    lore:
      - "Forjado con chatarra."
      - "No es bonito, pero corta."

  machete_enriquecido:
    material: IRON_SWORD
    enchantments:
      DAMAGE_ALL: 4
      FIRE_ASPECT: 1
    name: "Machete Enriquecido"
    lore:
      - "Machete mejorado con"
      - "experiencia de cazador."
      - "Sharpness IV, Fire Aspect I"

  arma_patron:
    material: DIAMOND_SWORD
    enchantments:
      DAMAGE_ALL: 5
      FIRE_ASPECT: 2
      LOOTING: 3
    name: "Arma del Patron"
    lore:
      - "Arma legendaria forjada"
      - "del cadaver de El Patron."
      - "Afilada, ardiente y mortal."
