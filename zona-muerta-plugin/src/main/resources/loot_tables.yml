# ===================================================================
# Zona Muerta - Loot Tables
# ===================================================================
# Configura el loot que sueltan los zombies y las estructuras

loot_tables:
  # Loot comun - zombies normales
  common:
    items:
      - material: ROTTEN_FLESH
        amount: 1-3
        chance: 50
      - material: BONE
        amount: 1-2
        chance: 30
      - material: IRON_NUGGET
        amount: 1-3
        chance: 20
      - material: BREAD
        amount: 1
        chance: 10
      - material: TORCH
        amount: 1-4
        chance: 15

  # Loot poco comun - zombies especiales
  uncommon:
    items:
      - material: IRON_INGOT
        amount: 1-2
        chance: 25
      - material: CHAINMAIL
        amount: 1
        chance: 20
      - material: GOLD_INGOT
        amount: 1
        chance: 15
      - material: DIAMOND
        amount: 1
        chance: 5
      - material: EMERALD
        amount: 1-2
        chance: 10

  # Loot raro - zombies elite
  rare:
    items:
      - material: DIAMOND
        amount: 1-3
        chance: 30
      - material: EMERALD
        amount: 1-3
        chance: 25
      - material: ENCHANTED_BOOK
        amount: 1
        chance: 15
      - material: IRON_CHESTPLATE
        amount: 1
        chance: 20
      - material: GOLDEN_APPLE
        amount: 1
        chance: 10

  # Loot epico - bosses y mutantes
  epic:
    items:
      - material: DIAMOND
        amount: 3-5
        chance: 40
      - material: ENCHANTED_GOLDEN_APPLE
        amount: 1-2
        chance: 25
      - material: NETHERITE_SCRAP
        amount: 1-2
        chance: 10
      - material: ANCIENT_DEBRIS
        amount: 1-2
        chance: 15
      - material: ECHO_SHARD
        amount: 1-3
        chance: 20

  # Loot legendario - El Patron y eventos especiales
  legendary:
    items:
      - material: DIAMOND
        amount: 5-10
        chance: 50
      - material: NETHERITE_INGOT
        amount: 1-2
        chance: 20
      - material: ENCHANTED_GOLDEN_APPLE
        amount: 3-5
        chance: 40
      - material: ECHO_SHARD
        amount: 5-10
        chance: 35

