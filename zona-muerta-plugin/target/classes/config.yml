# ===================================================================
# Configuracion Avanzada de IA
# ===================================================================
# Controla como los zombies detectan y persiguen jugadores.
ai:
  # Tiempo (en milisegundos) que un zombie recuerda a un jugador tras perderlo de vista.
  memory_duration: 5000
  # Rangos de ruido - a que distancia (en bloques) ciertas acciones del jugador atraen zombies.
  noise:
    sprint_range: 20
    eating_range: 12
    bow_range: 25
    torch_range: 30
  # Comportamiento grupal - los zombies pueden formar manadas con un lider.
  group:
    # Probabilidad (0.0-1.0) de que un grupo aparecido tenga un lider.
    leader_chance: 0.3
    # Radio usado para propagar agresion en manada.
    radius: 15
    # Distancia que los seguidores intentan mantener de su lider.
    follow_radius: 10
  # Destruccion de bloques - los zombies pueden romper ciertos bloques para alcanzar jugadores.
  breaking:
    # Interruptor principal para la IA de destruccion de bloques.
    enabled: true
    # Distancia maxima del zombie para considerar bloques para destruir.
    radius: 2
    # Retraso de destruccion por defecto (ticks) si un bloque no tiene sobreescritura.
    default_cooldown_ticks: 60
    # Sobreescrituras de tiempo por bloque en ticks.
    blocks:
      OAK_DOOR:
        cooldown_ticks: 40
      ACACIA_DOOR:
        cooldown_ticks: 40
      SPRUCE_DOOR:
        cooldown_ticks: 40
      BIRCH_DOOR:
        cooldown_ticks: 40
      JUNGLE_DOOR:
        cooldown_ticks: 40
      DARK_OAK_DOOR:
        cooldown_ticks: 40
      CRIMSON_DOOR:
        cooldown_ticks: 40
      WARPED_DOOR:
        cooldown_ticks: 40
      TRAPPED_CHEST:
        cooldown_ticks: 50
      CHEST:
        cooldown_ticks: 50
      OAK_FENCE:
        cooldown_ticks: 30
      SPRUCE_FENCE:
        cooldown_ticks: 30
      BIRCH_FENCE:
        cooldown_ticks: 30
      JUNGLE_FENCE:
        cooldown_ticks: 30
      DARK_OAK_FENCE:
        cooldown_ticks: 30
      ACACIA_FENCE:
        cooldown_ticks: 30

# ===================================================================
# Sistema de Evolucion
# ===================================================================
# Los zombies ganan experiencia al matar mobs y jugadores, subiendo de nivel para volverse mas fuertes.
evolution:
  # Interruptor principal para el sistema de niveles/evolucion.
  enabled: true
  # Experiencia ganada por matar un mob pasivo (animales, aldeanos).
  exp_per_passive_mob: 1.0
  # Experiencia ganada por matar un jugador.
  exp_per_player_kill: 10.0
  # Nivel maximo que un zombie puede alcanzar. Al nivel maximo, los zombies normales pueden mutar.
  max_level: 10

# ===================================================================
# Sistema de Infeccion
# ===================================================================
# Los jugadores pueden infectarse al ser golpeados por zombies.
# Al 100% de infeccion, el jugador se convierte en zombie con una mutacion aleatoria.
infection_system:
  # Interruptor principal para las mecanicas de infeccion.
  enabled: true
  # Probabilidad (%) por golpe de que el jugador se infecte.
  chance_on_hit: 5.0
  # Cuanto (%) aumenta la infeccion por cada tirada de infeccion exitosa.
  infection_increase: 10.0
  # Porcentaje maximo de infeccion (activa la zombificacion completa).
  max_infection: 100.0
