# ============================================================
#  CUSTOM ITEMS (para pociones especiales etc)
# ============================================================
custom_items:
  cure_potion:
    material: POTION
    display_name: "&d&lPocion de Cura Zombie"
    lore:
      - "&7Cura la infection zombie completamente."
      - "&c&lEFECTO: Cura Instantanea IV + Regeneracion V"
    potion_effects:
      - type: INSTANT_HEAL
        amplifier: 3
        duration_ticks: 1
      - type: REGENERATION
        amplifier: 4
        duration_ticks: 200
    persistent_data:
      type: cure_potion
      value: "true"