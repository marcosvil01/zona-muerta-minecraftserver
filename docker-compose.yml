services:
  minecraft:
    image: itzg/minecraft-server:latest
    container_name: minecraft-server
    restart: unless-stopped
    ports:
      - '25565:25565'
    environment:
      EULA: 'TRUE'
      TYPE: PAPER
      VERSION: '1.21.4'
      MEMORY: 4G
      MAX_PLAYERS: 50
      MOTD: '\u00a74\u00a7l\u2620 Zona Muerta \u2620\n\u00a77Apocalipsis Zombie - Sobrevive si puedes...'
      DIFFICULTY: hard
      VIEW_DISTANCE: 10
      SIMULATION_DISTANCE: 8
      SPAWN_PROTECTION: 0
      ENABLE_COMMAND_BLOCK: 'true'
      MODE: survival
      PVP: 'true'
      ONLINE_MODE: 'true'
      SPAWN_MONSTERS: 'true'
      MAX_WORLD_SIZE: 10000
      PLAYER_IDLE_TIMEOUT: 30
      RCON_PORT: 25575
      RCON_PASSWORD: '${RCON_PASSWORD:-changeme}'
      ENABLE_RCON: 'true'
      MODRINTH_PROJECTS: |
        viaversion
        viabackwards
        luckperms
        vaultunlocked
        essentialsx
        griefprevention
        coreprotect
        mythicmobs
        kotlinplugins
        grappling-hook
        placeholderapi
        worldedit
        worldguard
        dynmap
        discordSRV
        imageonlinemod
        invsee
        keeps统一
      MODRINTH_DOWNLOAD_DEPENDENCIES: required
      BACKUP_SCHEDULE: "0 3 * * *"
      BACKUP_DIR: "/data/backups"
      BACKUP_RETENTION_DAYS: 7
    volumes:
      - minecraft-data:/data
      - ./scripts:/data/scripts
      - ./plugins:/data/plugins
    deploy:
      resources:
        limits:
          memory: 4608M
        reservations:
          memory: 2560M
    healthcheck:
      test: mc-health
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s

volumes:
  minecraft-data:
    name: minecraft-data
